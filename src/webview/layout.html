    <button type="button" data-cmd="numbered" title="Numaralı liste" aria-label="Numaralı liste"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6h11M10 12h11M10 18h11M3 4h1v4M3 8h2M2 14c0-3 4-3 4-1 0 1-4 4-4 5h4"/></svg></button>
    <button type="button" data-cmd="task" title="Görev listesi" aria-label="Görev listesi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 12 3 3 7-7"/></svg></button>
    <button type="button" data-cmd="quote" title="Alıntı" aria-label="Alıntı"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h7v7H4c0 4 2 5 4 5M14 6h7v7h-6c0 4 2 5 4 5"/></svg></button>

  <div class="toolbar-group" role="group" aria-label="Ekle">

    <button type="button" data-cmd="image" title="Görsel" aria-label="Görsel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m21 15-6-6L4 21"/></svg><span>Görsel</span></button>

    <button type="button" data-cmd="mermaid" title="Diyagram" aria-label="Diyagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="5" rx="1"/><rect x="1" y="17" width="8" height="5" rx="1"/><rect x="15" y="17" width="8" height="5" rx="1"/><path d="M12 7v5M5 17v-5h14v5"/></svg></button>
  </div>
  </div>
  <span id="dirty" title="Kaydedilmemiş değişiklik"></span>
  <div class="seg" role="tablist" aria-label="Mod">
    <button id="btn-source" data-mode="source" title="Kaynak (ham markdown)">Kaynak</button>
    <button id="btn-live" data-mode="live" title="Canlı düzenleme (Word benzeri)">Canlı</button>
    <button id="btn-split" data-mode="split" title="Split (kaynak + önizleme)">Split</button>
    <button id="btn-reading" data-mode="reading" title="Okuma (salt okunur önizleme)">Okuma</button>
  </div>
  <select id="ui-language" aria-label="Dil" title="Dil"><option value="en">English</option><option value="tr">Türkçe</option></select>
  <span id="pkgmark" title="Derleme paketi">paket-13</span>
</div>
<div id="sync-alert" class="document-notice hidden" role="status"><span id="sync-message"></span><button id="sync-retry" type="button">Yeniden dene</button></div>
<div id="findbar" class="hidden">
  <div class="frow">
    <input id="find-input" type="text" placeholder="Bul…" aria-label="Bul" />
    <button type="button" data-ffind="case" title="Büyük/küçük harf eşleşmesi">Aa</button>
    <button type="button" data-ffind="word" title="Tüm sözcük">ab</button>
    <button type="button" data-ffind="regex" title="Normal ifade">.*</button>
    <span id="find-count"></span>
    <button type="button" data-ffind="prev" title="Önceki">↑</button>
    <button type="button" data-ffind="next" title="Sonraki">↓</button>
    <button type="button" data-ffind="toggle-replace" title="Değiştir">≡</button>
    <button type="button" data-ffind="close" title="Kapat">✕</button>
  </div>
  <div class="frow hidden" id="replace-row">
    <input id="replace-input" type="text" placeholder="Değiştir…" aria-label="Değiştir" />
    <button type="button" data-ffind="replace" title="Değiştir">Değiştir</button>
    <button type="button" data-ffind="replace-all" title="Tümünü değiştir">Tümü</button>
  </div>
</div>
<div id="main-row">
<div id="source-wrap" class="hidden"><div id="cm-host"></div></div>
<div id="split-preview" class="hidden"><div id="split-root" class="md-body"></div></div>
</div>
<div id="live-wrap" class="hidden"><div id="live-root" class="md-body"></div></div>
<div id="reading-wrap" class="hidden"><div id="reading-root" class="md-body"></div><div id="back-to-live">Canlı düzenlemeye dönmek için çift tıklayın</div></div>
